# ==============================================================================
# RoadSense Production Nginx Configuration for Amazon EC2
# Reverse proxy routing:
#   /api/*  -> Gunicorn WSGI Flask backend (127.0.0.1:6969)
#   /auth/* -> Gunicorn WSGI Flask backend (127.0.0.1:6969)
#   /*      -> React Admin Web App static files (/var/www/roadsense-admin/dist)
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Static Assets with 1-Year Cache & Exact MIME Serving
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        root /var/www/roadsense-admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # React Admin Web App Static Files (SPA Routing)
    location / {
        root /var/www/roadsense-admin;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Python Flask Backend REST APIs
    location /api/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Authentication Endpoints
    location /auth/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Fallback (if any local images exist)
    location /uploaded_images/ {
        alias /var/www/roadsense/lib/backend/uploaded_images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip Compression for Fast Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
